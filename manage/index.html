<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>文章管理 · 慢慢懂得生活</title>
<style>
  :root{ --bg:#f7f7f8; --card:#fff; --line:#e3e3e6; --text:#1c1c1e; --dim:#6b6b70; --brand:#0a6cff; --danger:#d33; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161618; --card:#1f1f22; --line:#34343a; --text:#ececef; --dim:#9a9aa2; --brand:#4c9bff; --danger:#ff6b6b; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
        font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap{ max-width:820px; margin:0 auto; padding:20px 16px 80px; }
  h1{ font-size:20px; margin:8px 0 4px; }
  .hint{ color:var(--dim); font-size:13px; margin:0 0 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label{ display:block; font-size:13px; color:var(--dim); margin:0 0 6px; }
  input[type=password]{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); font:inherit; }
  button{ padding:8px 14px; border-radius:8px; border:1px solid var(--line);
          background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button:hover{ border-color:var(--brand); }
  button.primary{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  button.del{ color:var(--danger); border-color:var(--danger); }
  button.del:hover{ background:var(--danger); color:#fff; }
  button.edit{ color:var(--brand); border-color:var(--brand); }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ok{ color:#1a9c53; font-size:13px; }
  .err{ color:var(--danger); font-size:13px; white-space:pre-wrap; }
  .mini{ font-size:12px; }
  .item{ display:flex; gap:12px; align-items:center; justify-content:space-between;
         border-top:1px solid var(--line); padding:12px 0; }
  .item:first-child{ border-top:0; }
  .meta{ min-width:0; flex:1; }
  .title{ font-weight:600; margin:0 0 2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub{ color:var(--dim); font-size:12px; }
  .empty{ color:var(--dim); font-size:14px; padding:16px 0; }
  a{ color:var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>文章管理</h1>
  <p class="hint">列出 <code>_posts</code> 里的所有文章。删除会直接提交到仓库，1～2 分钟后站点更新。</p>

  <section class="card">
    <label>GitHub 令牌（和发布页共用，一般不用再填）</label>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_..." style="flex:1;min-width:200px">
      <button id="saveToken" type="button">保存</button>
      <button id="clearToken" type="button">清除</button>
      <button id="reload" type="button" class="primary">刷新列表</button>
    </div>
    <div id="tokenState" class="mini" style="margin-top:6px"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <strong id="count">文章列表</strong>
      <span id="status" class="mini"></span>
    </div>
    <div id="list"><p class="empty">点「刷新列表」加载。</p></div>
  </section>
</div>

<script>
(function () {
  var OWNER = 'golsoni';
  var REPO  = 'golsoni.github.io';
  var BRANCH = 'main';
  var SITE = 'https://golsoni.github.io';

  var $ = function (id) { return document.getElementById(id); };
  var token = localStorage.getItem('gh_token') || '';
  var posts = [];

  function paintToken() {
    var s = $('tokenState');
    if (token) {
      s.textContent = '✅ 已保存令牌（结尾 ' + token.slice(-4) + '）';
      s.className = 'ok mini';
    } else {
      s.textContent = '还没有令牌。先去 https://golsoni.github.io/publish/ 保存一次，或者在这里粘贴。';
      s.className = 'err mini';
    }
  }
  $('saveToken').onclick = function () {
    var v = $('token').value.trim();
    if (!v) return;
    token = v;
    localStorage.setItem('gh_token', v);
    $('token').value = '';
    paintToken();
    load();
  };
  $('clearToken').onclick = function () {
    token = '';
    localStorage.removeItem('gh_token');
    paintToken();
  };

  function setStatus(msg, cls) {
    var s = $('status');
    s.textContent = msg || '';
    s.className = 'mini ' + (cls || '');
  }

  function api(path, method, body) {
    return fetch('https://api.github.com' + path, {
      method: method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = {};
        try { data = t ? JSON.parse(t) : {}; } catch (e) {}
        if (!res.ok) {
          var msg = data.message || ('HTTP ' + res.status);
          if (res.status === 401) msg = '令牌无效或已过期';
          if (res.status === 403) msg = '令牌权限不足（需要 Contents: Read and write）';
          if (res.status === 404) msg = '找不到这个文件或仓库';
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function rawFile(path) {
    return fetch('https://api.github.com' + path, {
      headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github.raw' }
    }).then(function (r) { return r.ok ? r.text() : ''; });
  }

  function parseMeta(text) {
    var out = { title: '', categories: '', slug: '' };
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    if (!m) return out;
    var fm = m[1];

    var t = fm.match(/^title:\s*(.+)$/m);
    if (t) {
      var v = t[1].trim();
      if (v.charAt(0) === '"') {
        try { v = JSON.parse(v); } catch (e) { v = v.replace(/^"|"$/g, ''); }
      } else {
        v = v.replace(/^['"]|['"]$/g, '');
      }
      out.title = v;
    }
    var c = fm.match(/^categories:\s*(.+)$/m);
    if (c) out.categories = c[1].replace(/^\[|\]$/g, '').replace(/"/g, '').replace(/'/g, '').trim();

    var s = fm.match(/^slug:\s*(.+)$/m);
    if (s) out.slug = s[1].trim().replace(/^['"]|['"]$/g, '');

    return out;
  }

  function humanDate(name) {
    var m = name.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? (m[1] + '-' + m[2] + '-' + m[3]) : '';
  }

  function load() {
    if (!token) { setStatus('先保存令牌', 'err'); return; }
    setStatus('加载中…');
    $('list').innerHTML = '<p class="empty">加载中…</p>';

    api('/repos/' + OWNER + '/' + REPO + '/contents/_posts?ref=' + BRANCH)
      .then(function (items) {
        var files = (items || []).filter(function (f) {
          return f.type === 'file' && /\.(md|markdown)$/i.test(f.name) && f.name !== '.placeholder';
        });
        files.sort(function (a, b) { return a.name < b.name ? 1 : -1; });

        return Promise.all(files.map(function (f) {
          return rawFile('/repos/' + OWNER + '/' + REPO + '/contents/' + f.path + '?ref=' + BRANCH)
            .then(function (text) {
              var meta = parseMeta(text);
              return {
                name: f.name,
                path: f.path,
                sha: f.sha,
                title: meta.title || f.name.replace(/\.md$/, ''),
                categories: meta.categories,
                slug: meta.slug,
                date: humanDate(f.name)
              };
            })
            .catch(function () {
              return { name: f.name, path: f.path, sha: f.sha, title: f.name, categories: '', date: humanDate(f.name) };
            });
        }));
      })
      .then(function (list) {
        posts = list;
        render();
        setStatus('共 ' + list.length + ' 篇');
      })
      .catch(function (e) {
        $('list').innerHTML = '<p class="err">加载失败：' + e.message + '</p>';
        setStatus('失败', 'err');
      });
  }

  function render() {
    $('count').textContent = '文章列表（' + posts.length + '）';
    var host = $('list');
    host.innerHTML = '';

    if (!posts.length) {
      host.innerHTML = '<p class="empty">_posts 里还没有文章。</p>';
      return;
    }

    posts.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'item';

      var meta = document.createElement('div');
      meta.className = 'meta';

      var t = document.createElement('p');
      t.className = 'title';
      t.textContent = p.title;
      meta.appendChild(t);

      var sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = p.date + (p.categories ? ' · ' + p.categories : '') + ' · ' + p.name;
      meta.appendChild(sub);

      var ops = document.createElement('span');
      ops.className = 'row';

      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'edit';
      edit.textContent = '编辑';
      edit.onclick = function () {
        window.open(SITE + '/publish/?t=' + Date.now() + '&edit=' + encodeURIComponent(p.name), '_blank');
      };
      ops.appendChild(edit);

      var open = document.createElement('button');
      open.type = 'button';
      open.textContent = '打开';
      open.onclick = function () {
        window.open(SITE + '/posts/' + encodeURIComponent(p.slug || slugOf(p.name)) + '/', '_blank');
      };
      ops.appendChild(open);

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '删除';
      del.onclick = function () { remove(p, del); };
      ops.appendChild(del);

      row.appendChild(meta);
      row.appendChild(ops);
      host.appendChild(row);
    });
  }

  function slugOf(name) {
    return name.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.(md|markdown)$/i, '');
  }

  function remove(p, btn) {
    if (!confirm('确定删除这篇吗？\n\n《' + p.title + '》\n\n删除后站点会自动重建，但文章内容不会保留（可以之后在仓库历史里找回）。')) return;

    btn.disabled = true;
    btn.textContent = '删除中…';
    setStatus('正在删除…');

    api('/repos/' + OWNER + '/' + REPO + '/contents/' + p.path, 'DELETE', {
      message: '删除文章：' + p.title,
      sha: p.sha,
      branch: BRANCH
    })
      .then(function () {
        setStatus('已删除，等 1～2 分钟站点更新', 'ok');
        posts = posts.filter(function (x) { return x.path !== p.path; });
        render();
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = '删除';
        setStatus('删除失败：' + e.message, 'err');
        alert('删除失败：' + e.message);
      });
  }

  $('reload').onclick = load;

  paintToken();
  if (token) load();
})();
</script>
</body>
</html>
