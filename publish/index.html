<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>发布 · 慢慢懂得生活</title>
<style>
  :root{ --bg:#f7f7f8; --card:#fff; --line:#e3e3e6; --text:#1c1c1e; --dim:#6b6b70; --brand:#0a6cff; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161618; --card:#1f1f22; --line:#34343a; --text:#ececef; --dim:#9a9aa2; --brand:#4c9bff; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
        font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px 100px; }
  h1{ font-size:20px; margin:8px 0 4px; }
  .hint{ color:var(--dim); font-size:13px; margin:0 0 18px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label{ display:block; font-size:13px; color:var(--dim); margin:10px 0 4px; }
  input[type=text],input[type=password],input[type=number],textarea{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--text); font:inherit; }
  textarea{ min-height:110px; resize:vertical; }
  button{ padding:8px 14px; border-radius:8px; border:1px solid var(--line);
          background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button:hover{ border-color:var(--brand); }
  button.primary{ background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  button.ghost{ color:var(--dim); }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .block{ border:1px dashed var(--line); border-radius:10px; padding:12px; margin-top:12px; }
  .block-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .tag{ font-size:12px; color:var(--dim); }
  .thumb{ max-width:100%; max-height:320px; border-radius:8px; display:block; margin-bottom:8px; }
  .two{ display:flex; gap:10px; }
  .two > div{ flex:1; }
  .ok{ color:#1a9c53; font-size:13px; }
  .err{ color:#d33; font-size:13px; white-space:pre-wrap; }
  .mini{ font-size:12px; }
  .drop{ outline:3px dashed var(--brand); outline-offset:-6px; }
  .gal{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; margin-top:10px; }
  .gal img{ width:100%; height:72px; object-fit:cover; border-radius:8px; cursor:pointer;
            border:1px solid var(--line); }
  .gal img:hover{ border-color:var(--brand); }
  .gal p{ grid-column:1 / -1; color:var(--dim); font-size:12px; margin:4px 0; }
  .chk{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); }
  .chk input{ width:auto; padding:0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>发布</h1>
  <p class="hint">这个页面直接用你的 GitHub 令牌把文章提交到仓库，不经过任何第三方。令牌只保存在本机浏览器里。</p>

  <section class="card">
    <label>GitHub 令牌（只保存在这台浏览器）</label>
    <div class="row">
      <input id="token" type="password" placeholder="github_pat_..." style="flex:1;min-width:200px">
      <button id="saveToken" type="button">保存</button>
      <button id="clearToken" type="button" class="ghost">清除</button>
    </div>
    <div id="tokenState" class="ok mini" style="margin-top:6px"></div>
  </section>

  <section class="card">
    <label>标题</label>
    <input id="title" type="text" placeholder="今天的晚饭">
    <label>分类（可从已有分类里选，也可以直接写新的）</label>
    <input id="category" type="text" list="cats" placeholder="日记">
    <datalist id="cats"></datalist>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>封面图（可选）</strong>
      <span class="row">
        <button id="pickCover" type="button">选择封面</button>
        <button id="pickOldCover" type="button">用以前的封面</button>
        <button id="clearCover" type="button" class="ghost">移除</button>
      </span>
    </div>
    <p class="hint mini" style="margin:8px 0 0">有封面的文章，首页会显示成「左图右文」的卡片。横图竖图都行，竖图会自动裁取中间区域。</p>
    <div id="coverBox" style="margin-top:10px"></div>
    <div id="coverGallery" class="gal" style="display:none"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <strong>内容</strong>
      <span class="row">
        <button id="addText" type="button">＋ 文字</button>
        <button id="addImage" type="button">＋ 图片</button>
      </span>
    </div>
    <div style="margin-top:10px">
      <label class="chk"><input id="autoCompress" type="checkbox" checked>
        上传前自动压缩（长边 1600px，画质 85%）</label>
    </div>
    <p class="hint mini" style="margin:8px 0 0">图片也可以直接<b>拖进本页</b>，或截图后按 <b>Ctrl+V</b> 粘贴。</p>
    <div id="blocks"></div>
  </section>

  <div class="row">
    <button id="publish" class="primary" type="button">发布</button>
    <span id="status"></span>
  </div>

  <input id="picker" type="file" accept="image/*" multiple hidden>
  <input id="coverPicker" type="file" accept="image/*" hidden>
</div>

<script>
(function () {
  var OWNER = 'golsoni';
  var REPO  = 'golsoni.github.io';
  var BRANCH = 'main';
  var SITE = 'https://golsoni.github.io';
  var MAX_EDGE = 1600;
  var QUALITY = 0.85;

  var $ = function (id) { return document.getElementById(id); };
  var token = localStorage.getItem('gh_token') || '';
  var blocks = [];
  var cover = { file: null, dataUrl: '', loading: false, note: '', err: '', url: '' };

  /* ---------- 令牌 ---------- */
  function paintToken() {
    var s = $('tokenState');
    if (token) {
      s.textContent = '✅ 已保存令牌（结尾 ' + token.slice(-4) + '）';
      s.className = 'ok mini';
    } else {
      s.textContent = '还没保存令牌，发表前必须先保存。';
      s.className = 'err mini';
    }
  }
  $('saveToken').onclick = function () {
    token = $('token').value.trim();
    if (!token) return;
    localStorage.setItem('gh_token', token);
    $('token').value = '';
    paintToken();
  };
  $('clearToken').onclick = function () {
    token = '';
    localStorage.removeItem('gh_token');
    paintToken();
  };

  if (localStorage.getItem('auto_compress') === '0') $('autoCompress').checked = false;
  $('autoCompress').onchange = function () {
    localStorage.setItem('auto_compress', $('autoCompress').checked ? '1' : '0');
  };

  /* ---------- 分类选项 ---------- */
  function loadCategories() {
    var fallback = ['日记', '生活', '日常', '旅行', '美食', '读书', '随笔'];

    function paint(items, showCount) {
      var seen = {}, html = '';
      items.forEach(function (it) {
        var name = it.name;
        if (!name || seen[name]) return;
        seen[name] = 1;
        html += '<option value="' + String(name).replace(/"/g, '&quot;') + '">' +
          (showCount && it.count ? String(name).replace(/</g, '&lt;') + '（' + it.count + '）' : '') +
          '</option>';
      });
      $('cats').innerHTML = html;
      if (!$('category').value) {
        $('category').value = (items[0] && items[0].name) || '日记';
      }
    }

    function asFallback(names) {
      var arr = names.map(function (c) { return { name: c, count: 0 }; });
      return arr.concat(fallback.map(function (c) { return { name: c, count: 0 }; }));
    }

    fetch('/assets/data/categories.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (arr) {
        if (arr && arr.length) {
          arr.sort(function (a, b) {
            return (b.count || 0) - (a.count || 0) || (a.name > b.name ? 1 : -1);
          });
          paint(arr.concat(fallback.map(function (c) { return { name: c, count: 0 }; })), true);
          return;
        }
        return fetch('/categories/', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (html) {
            var names = [], re = /href="\/categories\/([^"\/]+)\/"/g, m;
            while ((m = re.exec(html))) {
              try { names.push(decodeURIComponent(m[1])); } catch (e) {}
            }
            paint(asFallback(names), false);
          })
          .catch(function () { paint(asFallback([]), false); });
      });
  }

  /* ---------- 图片压缩 ---------- */
  function kb(n) { return Math.round(n / 1024) + 'KB'; }
  function human(n) { return n >= 1024 * 1024 ? (n / 1024 / 1024).toFixed(1) + 'MB' : kb(n); }

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      if (window.createImageBitmap) {
        createImageBitmap(file, { imageOrientation: 'from-image' })
          .then(resolve)
          .catch(function () { viaImg(file).then(resolve).catch(reject); });
      } else {
        viaImg(file).then(resolve).catch(reject);
      }
    });
  }
  function viaImg(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function compressImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type || '')) {
      return Promise.resolve({ file: file, from: file.size, to: file.size });
    }
    return loadImage(file).then(function (src) {
      var w = src.width, h = src.height;
      var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
      if (scale === 1 && file.size < 400 * 1024) {
        return { file: file, from: file.size, to: file.size };
      }
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(src, 0, 0, cw, ch);
      if (src.close) { try { src.close(); } catch (e) {} }

      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          if (!blob || blob.size >= file.size) {
            resolve({ file: file, from: file.size, to: file.size });
            return;
          }
          var name = String(file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
          resolve({ file: new File([blob], name, { type: 'image/jpeg' }), from: file.size, to: blob.size });
        }, 'image/jpeg', QUALITY);
      });
    });
  }

  function readDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var rd = new FileReader();
      rd.onload = function () { resolve(rd.result); };
      rd.onerror = reject;
      rd.readAsDataURL(file);
    });
  }

  function processFile(f) {
    if (!f || !/^image\//.test(f.type || '')) return Promise.reject(new Error('format'));
    var task = $('autoCompress').checked
      ? compressImage(f)
      : Promise.resolve({ file: f, from: f.size, to: f.size });
    return task.then(function (res) {
      return readDataUrl(res.file).then(function (d) {
        return { file: res.file, dataUrl: d, from: res.from, to: res.to };
      });
    });
  }

  /* ---------- 封面 ---------- */
  function renderCover() {
    var box = $('coverBox');
    box.innerHTML = '';
    if (cover.err) {
      var pe = document.createElement('p');
      pe.className = 'err mini';
      pe.textContent = cover.err;
      box.appendChild(pe);
      return;
    }
    if (cover.loading) {
      var pw = document.createElement('p');
      pw.className = 'hint mini';
      pw.textContent = '处理中…';
      box.appendChild(pw);
      return;
    }
    if (!cover.dataUrl) {
      var pn = document.createElement('p');
      pn.className = 'hint mini';
      pn.textContent = '还没有选择封面。没有封面也能正常发布。';
      box.appendChild(pn);
      return;
    }
    var img = document.createElement('img');
    img.className = 'thumb';
    img.src = cover.dataUrl;
    box.appendChild(img);
    if (cover.note) {
      var p2 = document.createElement('p');
      p2.className = 'hint mini';
      p2.style.margin = '0';
      p2.textContent = cover.note;
      box.appendChild(p2);
    }
  }

  $('pickCover').onclick = function () { $('coverPicker').click(); };
  $('coverPicker').onchange = function () {
    var f = $('coverPicker').files && $('coverPicker').files[0];
    $('coverPicker').value = '';
    if (!f) return;
    cover.err = '';
    cover.loading = true;
    renderCover();
    processFile(f)
      .then(function (res) {
        cover.file = res.file;
        cover.dataUrl = res.dataUrl;
        cover.note = res.to < res.from
          ? '已压缩 ' + human(res.from) + ' → ' + human(res.to)
          : '保持原图 ' + human(res.to);
        cover.loading = false;
        renderCover();
      })
      .catch(function () {
        cover.loading = false;
        cover.err = '这张图读不出来，可能是 HEIC/HEIF 格式。请导出成 JPG 再试。';
        renderCover();
      });
  };
  $('clearCover').onclick = function () {
    cover = { file: null, dataUrl: '', loading: false, note: '', err: '', url: '' };
    renderCover();
  };

  /* 复用以前发过的封面 */
  $('pickOldCover').onclick = function () {
    var box = $('coverGallery');
    if (box.style.display === 'block') { box.style.display = 'none'; return; }
    box.style.display = 'block';
    box.innerHTML = '<p>加载中…</p>';
    if (!token) { box.innerHTML = '<p>先保存 GitHub 令牌，才能读取以前用过的封面。</p>'; return; }

    api('/repos/' + OWNER + '/' + REPO + '/contents/assets/img?ref=' + BRANCH)
      .then(function (items) {
        var list = (items || []).filter(function (f) {
          return f.type === 'file' && /-cover\.(jpe?g|png|webp)$/i.test(f.name);
        });
        list.sort(function (a, b) { return a.name < b.name ? 1 : -1; });
        if (!list.length) { box.innerHTML = '<p>还没有用过的封面。</p>'; return; }

        box.innerHTML = '';
        list.forEach(function (f) {
          var img = document.createElement('img');
          img.src = '/assets/img/' + f.name;
          img.title = f.name;
          img.onclick = function () {
            cover = {
              file: null,
              dataUrl: '/assets/img/' + f.name,
              loading: false,
              note: '使用已有封面：' + f.name,
              err: '',
              url: '/assets/img/' + f.name
            };
            renderCover();
            box.style.display = 'none';
          };
          box.appendChild(img);
        });
      })
      .catch(function (e) {
        box.innerHTML = '<p>读取失败：' + e.message + '</p>';
      });
  };

  /* ---------- 内容块 ---------- */
  function addText(value) {
    blocks.push({ type: 'text', value: value || '' });
    render();
  }

  function addImageFromFile(f) {
    if (!f || !/^image\//.test(f.type || '')) return;
    if (f.size > 20 * 1024 * 1024) { alert('「' + (f.name || '图片') + '」超过 20MB，请先自己压缩一下。'); return; }

    var b = { type: 'image', file: f, dataUrl: '', caption: '', width: '', loading: true, note: '', err: '' };
    blocks.push(b);
    render();

    processFile(f)
      .then(function (res) {
        b.file = res.file;
        b.dataUrl = res.dataUrl;
        b.loading = false;
        b.note = res.to < res.from
          ? '已压缩 ' + human(res.from) + ' → ' + human(res.to)
          : '保持原图 ' + human(res.to);
        b.err = '';
        render();
      })
      .catch(function () {
        b.loading = false;
        b.err = '这张图读不出来，可能是 HEIC/HEIF 格式。请在相册里导出成 JPG 再传。';
        render();
      });
  }

  function pickImages() { $('picker').click(); }

  $('addText').onclick = function () { addText(''); };
  $('addImage').onclick = pickImages;
  $('picker').onchange = function () {
    var fs = $('picker').files || [];
    for (var i = 0; i < fs.length; i++) addImageFromFile(fs[i]);
    $('picker').value = '';
  };

  document.addEventListener('paste', function (e) {
    var dt = e.clipboardData;
    if (!dt) return;
    var items = dt.items || [];
    var got = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type || '')) {
        var f = items[i].getAsFile();
        if (f) { addImageFromFile(f); got = true; }
      }
    }
    if (got) e.preventDefault();
  });

  document.body.addEventListener('dragover', function (e) {
    if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf('Files') >= 0) {
      e.preventDefault();
      document.body.classList.add('drop');
    }
  });
  document.body.addEventListener('dragleave', function () { document.body.classList.remove('drop'); });
  document.body.addEventListener('drop', function (e) {
    document.body.classList.remove('drop');
    var fs = e.dataTransfer && e.dataTransfer.files;
    if (!fs || !fs.length) return;
    var has = false;
    for (var i = 0; i < fs.length; i++) if (/^image\//.test(fs[i].type || '')) has = true;
    if (!has) return;
    e.preventDefault();
    for (var j = 0; j < fs.length; j++) addImageFromFile(fs[j]);
  });

  function moveBlock(b, dir) {
    var i = blocks.indexOf(b), j = i + dir;
    if (i < 0 || j < 0 || j >= blocks.length) return;
    blocks[i] = blocks[j]; blocks[j] = b;
    render();
  }
  function removeBlock(b) {
    var i = blocks.indexOf(b);
    if (i >= 0) blocks.splice(i, 1);
    render();
  }
  function mkBtn(text, fn, cls) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = text;
    if (cls) b.className = cls;
    b.onclick = fn;
    return b;
  }

  function render() {
    var host = $('blocks');
    host.innerHTML = '';

    blocks.forEach(function (b) {
      var box = document.createElement('div');
      box.className = 'block';

      var head = document.createElement('div');
      head.className = 'block-head';
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = b.type === 'text' ? '文字段' : '图片';
      var ops = document.createElement('span');
      ops.className = 'row';
      ops.appendChild(mkBtn('↑', function () { moveBlock(b, -1); }, 'mini'));
      ops.appendChild(mkBtn('↓', function () { moveBlock(b, 1); }, 'mini'));
      ops.appendChild(mkBtn('换图', function () { pickImages(); }, 'mini'));
      ops.appendChild(mkBtn('删除', function () { removeBlock(b); }, 'mini ghost'));
      head.appendChild(tag); head.appendChild(ops);
      box.appendChild(head);

      if (b.type === 'text') {
        var ta = document.createElement('textarea');
        ta.value = b.value;
        ta.placeholder = '在这里写正文，空行分段。';
        ta.oninput = function () { b.value = ta.value; };
        box.appendChild(ta);
      } else {
        if (b.err) {
          var pe = document.createElement('p');
          pe.className = 'err mini';
          pe.textContent = b.err;
          box.appendChild(pe);
        } else if (b.dataUrl) {
          var img = document.createElement('img');
          img.className = 'thumb';
          img.src = b.dataUrl;
          box.appendChild(img);
        } else {
          var pw = document.createElement('p');
          pw.className = 'hint mini';
          pw.textContent = '处理中…';
          box.appendChild(pw);
        }

        if (b.note) {
          var pn = document.createElement('p');
          pn.className = 'hint mini';
          pn.style.margin = '0 0 8px';
          pn.textContent = b.note;
          box.appendChild(pn);
        }

        var two = document.createElement('div');
        two.className = 'two';

        var d1 = document.createElement('div');
        var l1 = document.createElement('label'); l1.textContent = '图片说明（可留空）';
        var i1 = document.createElement('input'); i1.type = 'text'; i1.value = b.caption;
        i1.placeholder = '公园门口的银杏';
        i1.oninput = function () { b.caption = i1.value; };
        d1.appendChild(l1); d1.appendChild(i1);

        var d2 = document.createElement('div');
        var l2 = document.createElement('label'); l2.textContent = '宽度（像素，留空=撑满）';
        var i2 = document.createElement('input'); i2.type = 'number'; i2.value = b.width;
        i2.placeholder = '700';
        i2.oninput = function () { b.width = i2.value; };
        d2.appendChild(l2); d2.appendChild(i2);

        two.appendChild(d1); two.appendChild(d2);
        box.appendChild(two);
      }

      host.appendChild(box);
    });
  }

  /* ---------- GitHub API ---------- */
  function api(path, opts) {
    opts = opts || {};
    return fetch('https://api.github.com' + path, {
      method: opts.method || 'GET',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (res) {
      return res.text().then(function (t) {
        var data = {};
        try { data = t ? JSON.parse(t) : {}; } catch (e) {}
        if (!res.ok) {
          var msg = data.message || ('HTTP ' + res.status);
          if (res.status === 401) msg = '令牌无效或已过期';
          if (res.status === 404) msg = '找不到仓库，或令牌没有这个仓库的权限';
          if (res.status === 403) msg = '令牌权限不足（需要 Contents: Read and write）';
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  function b64encodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  function extOf(type, name) {
    var m = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/webp': 'webp' };
    if (m[type]) return m[type];
    var e = String(name || '').split('.').pop().toLowerCase();
    return /^(jpg|jpeg|png|gif|webp)$/.test(e) ? e : 'jpg';
  }
  function bjNow() {
    var d = new Date(Date.now() + 8 * 3600 * 1000);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return {
      ymd: d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()),
      hms: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':00',
      stamp: p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds())
    };
  }
  function setStatus(html, cls) {
    var s = $('status');
    s.innerHTML = html;
    s.className = cls || '';
  }
  function nextSlug(ymd) {
    return api('/repos/' + OWNER + '/' + REPO + '/contents/_posts?ref=' + BRANCH)
      .then(function (list) {
        var n = (list || []).filter(function (f) { return f.name.indexOf(ymd) === 0; }).length;
        return n === 0 ? ymd : (ymd + '-' + (n + 1));
      })
      .catch(function () { return ymd + '-' + bjNow().stamp; });
  }

  /* ---------- 发布 ---------- */
  $('publish').onclick = function () {
    var title = ($('title').value || '').trim();
    var cat = ($('category').value || '').trim() || '日记';

    if (!token) { setStatus('先保存 GitHub 令牌。', 'err'); return; }
    if (!title) { setStatus('标题不能为空。', 'err'); return; }

    var hasText = blocks.some(function (b) { return b.type === 'text' && b.value.trim(); });
    var imgs = blocks.filter(function (b) { return b.type === 'image'; });
    if (!hasText && imgs.length === 0) { setStatus('内容还是空的，先加点文字或图片。', 'err'); return; }
    if (imgs.some(function (b) { return b.err; })) { setStatus('有一张图片读不出来，先删掉或换一张。', 'err'); return; }
    if (imgs.some(function (b) { return !b.dataUrl; })) { setStatus('有图片还在处理，稍等两秒再点发布。', 'err'); return; }
    if (cover.loading) { setStatus('封面还在处理，稍等一下。', 'err'); return; }
    if (cover.err) { setStatus('封面图读不出来，先移除或换一张。', 'err'); return; }

    var now = bjNow();
    var total = imgs.length + (cover.file ? 1 : 0);
    var busy = 0;

    $('publish').disabled = true;
    setStatus('准备中…', '');

    var chain = Promise.resolve();

    imgs.forEach(function (b, idx) {
      chain = chain.then(function () {
        busy++;
        setStatus('上传图片 ' + busy + '/' + total + '…', '');
        var b64 = b.dataUrl.split(',')[1];
        var name = now.ymd + '-' + now.stamp + '-' + (idx + 1) + '.' + extOf(b.file && b.file.type, b.file && b.file.name);
        b.url = '/assets/img/' + name;
        return api('/repos/' + OWNER + '/' + REPO + '/contents/assets/img/' + name, {
          method: 'PUT',
          body: { message: '上传图片 ' + name, content: b64, branch: BRANCH }
        });
      });
    });

    if (cover.file) {
      chain = chain.then(function () {
        busy++;
        setStatus('上传封面 ' + busy + '/' + total + '…', '');
        var b64 = cover.dataUrl.split(',')[1];
        var name = now.ymd + '-' + now.stamp + '-cover.' + extOf(cover.file.type, cover.file.name);
        cover.url = '/assets/img/' + name;
        return api('/repos/' + OWNER + '/' + REPO + '/contents/assets/img/' + name, {
          method: 'PUT',
          body: { message: '上传封面 ' + name, content: b64, branch: BRANCH }
        });
      });
    }

    chain
      .then(function () {
        setStatus('生成文章…', '');
        return nextSlug(now.ymd);
      })
      .then(function (slug) {
        var body = '';
        blocks.forEach(function (b) {
          if (b.type === 'text') {
            var t = b.value.trim();
            if (t) body += t + '\n\n';
          } else if (b.url) {
            var cap = (b.caption || '').trim();
            var w = (b.width || '').trim();
            var attr = w ? '{: w="' + w + '" }' : '';
            body += '![' + cap + '](' + b.url + ')' + attr + '\n';
            if (cap) body += '_' + cap + '_\n';
            body += '\n';
          }
        });

        var fm = '---\n' +
          'title: ' + JSON.stringify(title) + '\n' +
          'date: ' + now.ymd + ' ' + now.hms + ' +0800\n' +
          'categories: [' + JSON.stringify(cat) + ']\n' +
          'slug: ' + JSON.stringify(slug) + '\n';

        if (cover.url) {
          fm += 'image:\n' +
                '  path: ' + cover.url + '\n' +
                '  alt: ' + JSON.stringify(title) + '\n';
        }

        var content = fm + '---\n\n' + body;

        return api('/repos/' + OWNER + '/' + REPO + '/contents/_posts/' + now.ymd + '-' + now.stamp + '.md', {
          method: 'PUT',
          body: { message: '发布：' + title, content: b64encodeUtf8(content), branch: BRANCH }
        }).then(function () { return slug; });
      })
      .then(function (slug) {
        setStatus('✅ 已提交，等 1～2 分钟后刷新博客。<br>' +
          '<a href="' + SITE + '/posts/' + slug + '/" target="_blank" rel="noopener">' +
          SITE + '/posts/' + slug + '/</a>', 'ok');
        $('title').value = '';
        blocks = [];
        cover = { file: null, dataUrl: '', loading: false, note: '', err: '', url: '' };
        render();
        renderCover();
        addText('');
      })
      .catch(function (e) {
        setStatus('发布失败：' + e.message, 'err');
      })
      .then(function () { $('publish').disabled = false; });
  };

  /* ---------- 启动 ---------- */
  paintToken();
  loadCategories();
  renderCover();
  addText('');
})();
</script>
</body>
</html>
